kind = "web"
previewPath = "/"
title = "Tutor Time Sports Dashboard"
description = "A polished tournament operations dashboard for Tutor Time that helps coordinators understand participation, search the student roster, and prepare jersey orders by size."
version = "1.0.0"
id = "artifacts/tutor-time-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20009

[services.development]
run = "pnpm --filter @workspace/tutor-time-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tutor-time-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/tutor-time-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20009"
BASE_PATH = "/"
